name: Bug report
description: Something on the site or in the code doesn't work as described.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead. A screenshot helps.
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Link
      description: The page URL, including options such as ?chapter= or ?mode=.
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Firefox 131 on Windows 11, laptop
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: Anything red in the browser's developer console.
      render: text
